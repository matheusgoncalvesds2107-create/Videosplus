<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Vídeos Plus</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#090909}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}header{position:absolute;z-index:5;top:0;left:0;right:0;text-align:center;padding:calc(env(safe-area-inset-top) + 15px) 12px 12px;background:linear-gradient(#0009,transparent);pointer-events:none}header button{pointer-events:auto;background:none;border:0;color:white;font-weight:700}header .active{border-bottom:2px solid #d4af37}.view{display:none;height:calc(100dvh - 65px - env(safe-area-inset-bottom));overflow:auto}.view.active{display:block}#feed{overflow:hidden}.pages{height:100%;overflow-y:auto;scroll-snap-type:y mandatory}.slide{height:100%;position:relative;scroll-snap-align:start;background:linear-gradient(135deg,#102940,#070707);overflow:hidden}.slide video{height:100%;width:100%;object-fit:contain;background:black}.placeholder{position:absolute;inset:0;display:grid;place-items:center;font-size:80px;color:#ffffff50}.overlay{position:absolute;bottom:30px;left:15px;right:90px;text-shadow:0 1px 5px black}.overlay p{font-size:14px}.side{position:absolute;right:12px;bottom:45px;display:grid;gap:18px;text-align:center}.side button{background:none;color:white;border:0;font-size:29px}.side small{display:block;font-size:12px}.liked{color:#ff4266!important}nav{height:calc(65px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:#101010;border-top:1px solid #292929}nav button{flex:1;border:0;background:none;color:#aaa;font-size:11px}nav button b{display:block;font-size:25px}nav button.active{color:#d4af37}.gold{background:#d4af37;color:#111;border:0;border-radius:10px;padding:14px;font-weight:700}.outline{background:transparent;color:#d4af37;border:1px solid #d4af37;border-radius:10px;padding:14px}.wrap{padding:22px 16px}.wrap h2{margin-top:8px}.field{display:block;width:100%;padding:13px;background:#222;color:white;border:1px solid #444;border-radius:10px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tile{position:relative;aspect-ratio:3/4;background:linear-gradient(135deg,#1d4265,#0b1627);border:0;color:white;overflow:hidden}.tile video{width:100%;height:100%;object-fit:cover}.tile span{position:absolute;bottom:5px;left:5px;text-shadow:0 1px 4px #000}.empty{text-align:center;color:#aaa;padding:35px 15px}.card{background:#1b1b1b;padding:14px;border-radius:12px;margin:12px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.muted{color:#aaa;font-size:13px}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:end}.modal.open{display:flex}.sheet{width:100%;background:#1b1b1b;border-radius:18px 18px 0 0;padding:18px;max-height:78dvh;overflow:auto}.comment{padding:12px 0;border-bottom:1px solid #333}.small{font-size:13px}#preview{max-height:260px;width:100%;background:#000}#recVideo{width:100%;max-height:270px;background:#000}.stats{display:flex;justify-content:space-around;text-align:center;margin:20px 0}.stats b{display:block}.profile-avatar{width:90px;height:90px;border-radius:50%;background:#d4af37;color:black;display:grid;place-items:center;font-size:40px;margin:15px auto}button:disabled{opacity:.5}
</style></head><body><section id="feed" class="view active"><header><button id="followingTab">Seguindo</button>　<button id="forYouTab" class="active">Para Você</button></header><div class="pages" id="pages"></div></section><section id="discover" class="view"><div class="wrap"><h2>Descobrir</h2><input class="field" id="search" placeholder="Pesquisar vídeos, criadores ou hashtags"><div class="grid" id="discoverGrid"></div></div></section><section id="create" class="view"><div class="wrap"><h2>Criar vídeo</h2><p class="muted">Publique um vídeo do aparelho ou grave pela câmera.</p><button class="gold" id="pick" style="width:100%">📁 Escolher da galeria</button><input id="file" type="file" accept="video/*" hidden><p><button class="outline" id="startRec" style="width:100%">📹 Gravar com câmera</button></p><video id="recVideo" autoplay muted playsinline hidden></video><p><button class="gold" id="stopRec" hidden>⏹ Parar gravação</button></p><video id="preview" controls playsinline hidden></video><input class="field" id="caption" maxlength="220" placeholder="Legenda e hashtags"><button class="gold" id="publish" disabled style="width:100%">Publicar vídeo</button><p id="uploadStatus" class="muted"></p></div></section><section id="inbox" class="view"><div class="wrap"><h2>Caixa de entrada</h2><div id="notifications"></div></div></section><section id="profile" class="view"><div class="wrap" style="text-align:center"><h2 id="profileHandle">@meu_perfil</h2><div class="profile-avatar">👤</div><h2 id="profileName">Vídeos Plus</h2><p id="profileBio">✨ Criando conteúdo inspirador ✨</p><div class="stats"><div><b id="countVideos">0</b>Vídeos</div><div><b id="countFollowers">0</b>Seguidores</div><div><b id="countFollowing">0</b>Seguindo</div></div><button class="outline" id="editProfile">Editar perfil</button><button class="outline" id="exportData">Exportar dados</button><input type="file" accept="application/json" id="importData" hidden><button class="outline" id="importButton">Importar dados</button><p class="muted">Vídeos ficam neste navegador. Exportação inclui somente metadados, não os arquivos de vídeo.</p></div><div class="grid" id="profileGrid"></div></section><nav id="nav"><button data-view="feed" class="active"><b>⌂</b>Início</button><button data-view="discover"><b>⌕</b>Descobrir</button><button data-view="create"><b>⊞</b>Criar</button><button data-view="inbox"><b>▣</b>Caixa</button><button data-view="profile"><b>♙</b>Perfil</button></nav><div class="modal" id="modal"><div class="sheet"><div class="row"><h3 id="modalTitle">Comentários</h3><button id="closeModal" class="outline">Fechar</button></div><div id="modalBody"></div></div></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db,items=[],tab='all',selectedFile=null,previewUrl=null,stream=null,recorder=null,chunks=[];const profile=()=>JSON.parse(localStorage.getItem('vp-profile')||'{"name":"Vídeos Plus","handle":"@meu_perfil","bio":"✨ Criando conteúdo inspirador ✨"}');const saveProfile=p=>localStorage.setItem('vp-profile',JSON.stringify(p));const uid=()=>crypto.randomUUID();const fmt=n=>n>=1000?(n/1000).toFixed(1)+'k':String(n);const notify=msg=>{let a=JSON.parse(localStorage.getItem('vp-notes')||'[]');a.unshift({id:uid(),msg,date:new Date().toLocaleString('pt-BR')});localStorage.setItem('vp-notes',JSON.stringify(a.slice(0,100)))};function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('videos-plus-db',1);r.onupgradeneeded=()=>{r.result.createObjectStore('videos',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function transaction(mode,fn){return new Promise((resolve,reject)=>{let t=db.transaction('videos',mode),s=t.objectStore('videos'),r=fn(s);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}const getAll=()=>transaction('readonly',s=>s.getAll());const put=x=>transaction('readwrite',s=>s.put(x));const del=id=>transaction('readwrite',s=>s.delete(id));const urls=new Map();function src(v){if(v.blob){if(!urls.has(v.id))urls.set(v.id,URL.createObjectURL(v.blob));return urls.get(v.id)}return ''}function stopVideos(){document.querySelectorAll('.slide video').forEach(v=>v.pause())}function activate(name){stopVideos();document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===name));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));if(name==='discover')drawGrid();if(name==='profile')drawProfile();if(name==='inbox')drawInbox();if(name==='feed')playVisible()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>activate(b.dataset.view));function filtered(){return tab==='following'?items.filter(v=>v.followed||v.owner):items}function drawFeed(){let p=$('#pages');p.innerHTML='';for(let v of filtered()){let e=document.createElement('article');e.className='slide';e.dataset.id=v.id;e.innerHTML=`${v.blob?`<video src="${src(v)}" loop playsinline preload="metadata"></video>`:'<div class="placeholder">▶</div>'}<div class="overlay"><strong>${esc(v.user)}</strong><p>${esc(v.caption)}</p><small>♫ ${esc(v.sound||'Som original')}</small></div><div class="side"><button data-act="like" class="${v.liked?'liked':''}">${v.liked?'♥':'♡'}<small>${fmt(v.likes||0)}</small></button><button data-act="comments">▤<small>${(v.comments||[]).length}</small></button><button data-act="share">↗<small>${v.shares||0}</small></button><button data-act="follow">${v.owner?'👤':v.followed?'✓':'+'}<small>${v.owner?'Você':v.followed?'Seguindo':'Seguir'}</small></button></div>`;e.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(v.id,b.dataset.act));e.querySelector('video')?.addEventListener('click',ev=>ev.currentTarget.paused?ev.currentTarget.play():ev.currentTarget.pause());p.append(e)}playVisible()}function playVisible(){let slides=[...document.querySelectorAll('.slide')],root=$('#pages');for(let s of slides){let v=s.querySelector('video');if(!v)continue;let visible=$('#feed').classList.contains('active')&&Math.abs(s.offsetTop-root.scrollTop)<root.clientHeight/2;if(visible)v.play().catch(()=>{});else v.pause()}}$('#pages').onscroll=()=>requestAnimationFrame(playVisible);$('#followingTab').onclick=()=>{tab='following';$('#followingTab').classList.add('active');$('#forYouTab').classList.remove('active');drawFeed()};$('#forYouTab').onclick=()=>{tab='all';$('#forYouTab').classList.add('active');$('#followingTab').classList.remove('active');drawFeed()};async function action(id,act){let v=items.find(x=>x.id===id);if(!v)return;if(act==='like'){v.liked=!v.liked;v.likes=Math.max(0,(v.likes||0)+(v.liked?1:-1));notify(v.liked?'Você curtiu um vídeo':'Curtida removida')}if(act==='follow'&&!v.owner){v.followed=!v.followed;notify(v.followed?'Você começou a seguir '+v.user:'Você deixou de seguir '+v.user)}if(act==='share'){v.shares=(v.shares||0)+1;try{if(navigator.share)await navigator.share({title:'Vídeos Plus',text:v.caption,url:location.href});else if(navigator.clipboard)await navigator.clipboard.writeText(location.href);else alert('Compartilhe o endereço: '+location.href)}catch(e){if(e.name==='AbortError')return;alert('Não foi possível compartilhar')}notify('Você compartilhou um vídeo')}if(act==='comments'){showComments(v);return}await put(v);drawFeed()}function showModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('open')}$('#closeModal').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};function showComments(v){showModal('Comentários',`<div id="commentList">${(v.comments||[]).map(c=>`<div class="comment"><b>${esc(c.user)}</b><p>${esc(c.text)}</p></div>`).join('')||'<p class="muted">Seja o primeiro a comentar.</p>'}</div><input id="newComment" class="field" maxlength="300" placeholder="Escreva um comentário"><button class="gold" id="sendComment">Enviar</button>`);$('#sendComment').onclick=async()=>{let text=$('#newComment').value.trim();if(!text)return;v.comments??=[];v.comments.push({user:profile().handle,text});await put(v);notify('Você comentou em um vídeo');showComments(v);drawFeed()}}function grid(target,list){$(target).innerHTML=list.map(v=>`<button class="tile" data-id="${v.id}">${v.blob?`<video muted preload="metadata" src="${src(v)}"></video>`:'▶'}<span>▶ ${fmt(v.likes||0)}</span></button>`).join('')||'<p class="empty">Nenhum vídeo encontrado.</p>';$(target).querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{tab='all';drawFeed();activate('feed');let el=[...document.querySelectorAll('.slide')].find(x=>x.dataset.id===b.dataset.id);el?.scrollIntoView({block:'start'})})}function drawGrid(){let q=$('#search').value.toLocaleLowerCase('pt-BR');grid('#discoverGrid',items.filter(v=>(v.caption+' '+v.user).toLocaleLowerCase('pt-BR').includes(q)))}$('#search').oninput=drawGrid;function drawProfile(){let p=profile();$('#profileHandle').textContent=p.handle;$('#profileName').textContent=p.name;$('#profileBio').textContent=p.bio;$('#countVideos').textContent=items.filter(v=>v.owner).length;$('#countFollowing').textContent=items.filter(v=>v.followed).length;$('#countFollowers').textContent='0';grid('#profileGrid',items.filter(v=>v.owner));$('#profileGrid').querySelectorAll('[data-id]').forEach(b=>{let id=b.dataset.id;b.oncontextmenu=async e=>{e.preventDefault();if(confirm('Excluir este vídeo?')){await del(id);let u=urls.get(id);if(u)URL.revokeObjectURL(u);urls.delete(id);items=await getAll();drawProfile();drawFeed()}}})}$('#editProfile').onclick=()=>{let p=profile();showModal('Editar perfil',`<input id="editName" class="field" maxlength="50" placeholder="Nome" value="${esc(p.name)}"><input id="editHandle" class="field" maxlength="30" placeholder="@usuario" value="${esc(p.handle)}"><textarea id="editBio" class="field" maxlength="160">${esc(p.bio)}</textarea><button id="saveEdit" class="gold">Salvar perfil</button>`);$('#saveEdit').onclick=()=>{let name=$('#editName').value.trim(),handle=$('#editHandle').value.trim().replace(/[^\w@.]/g,'');if(!name||!handle)return alert('Informe nome e usuário');saveProfile({name,handle:handle.startsWith('@')?handle:'@'+handle,bio:$('#editBio').value.trim()});$('#modal').classList.remove('open');drawProfile()}};function drawInbox(){let notes=JSON.parse(localStorage.getItem('vp-notes')||'[]');$('#notifications').innerHTML=notes.map(n=>`<div class="card">${esc(n.msg)}<div class="muted">${esc(n.date)}</div></div>`).join('')||'<div class="empty">Nenhuma atividade ainda.</div>'}$('#pick').onclick=()=>$('#file').click();function setFile(file){if(!file)return;if(!file.type.startsWith('video/'))return alert('Escolha um vídeo válido');if(file.size>150*1024*1024)return alert('Limite de 150 MB por vídeo');selectedFile=file;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(file);$('#preview').src=previewUrl;$('#preview').hidden=false;$('#publish').disabled=false;$('#uploadStatus').textContent=`Selecionado: ${file.name} (${Math.round(file.size/1048576)} MB)`}$('#file').onchange=e=>setFile(e.target.files[0]);$('#startRec').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});$('#recVideo').srcObject=stream;$('#recVideo').hidden=false;let type=['video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});setFile(new File([blob],`gravacao-${Date.now()}.${blob.type.includes('mp4')?'mp4':'webm'}`,{type:blob.type}));stream.getTracks().forEach(t=>t.stop());$('#recVideo').hidden=true;$('#stopRec').hidden=true;$('#startRec').hidden=false};recorder.start();$('#stopRec').hidden=false;$('#startRec').hidden=true}catch(e){alert('Não foi possível acessar a câmera: '+e.message)}};$('#stopRec').onclick=()=>{if(recorder?.state==='recording')recorder.stop()};$('#publish').onclick=async()=>{if(!selectedFile)return;$('#publish').disabled=true;try{let v={id:uid(),user:profile().handle,caption:$('#caption').value.trim()||'Meu vídeo no Vídeos Plus',sound:'Som original',likes:0,shares:0,comments:[],owner:true,followed:false,liked:false,created:Date.now(),blob:selectedFile};await put(v);items=await getAll();items.sort((a,b)=>b.created-a.created);notify('Seu vídeo foi publicado neste aparelho');selectedFile=null;$('#file').value='';$('#caption').value='';$('#preview').hidden=true;$('#preview').removeAttribute('src');if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;$('#uploadStatus').textContent='Vídeo publicado!';drawFeed();activate('feed')}catch(e){alert('Erro ao salvar. Verifique o espaço disponível no navegador: '+e.message);$('#publish').disabled=false}};$('#exportData').onclick=()=>{let data={profile:profile(),videos:items.map(({blob,...v})=>v),notes:JSON.parse(localStorage.getItem('vp-notes')||'[]')};let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='videos-plus-dados.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#importButton').onclick=()=>$('#importData').click();$('#importData').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(data.profile)saveProfile(data.profile);if(Array.isArray(data.videos))for(let v of data.videos){if(v.id&&typeof v.caption==='string')await put({...v,blob:null})}if(Array.isArray(data.notes))localStorage.setItem('vp-notes',JSON.stringify(data.notes));items=await getAll();items.sort((a,b)=>(b.created||0)-(a.created||0));drawFeed();drawProfile();alert('Dados importados. Os vídeos originais não estão incluídos no backup.')}catch(err){alert('Arquivo inválido: '+err.message)}};async function init(){try{db=await openDB();items=await getAll();items.sort((a,b)=>(b.created||0)-(a.created||0));drawFeed();if(!items.length)$('#pages').innerHTML='<div class="empty" style="padding-top:45vh">Nenhum vídeo ainda.<p>Toque em Criar para publicar seu primeiro vídeo.</p></div>';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){alert('Este navegador não permite armazenamento local: '+e.message)}}init();
</script></body></html>
